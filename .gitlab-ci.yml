# Minimal CI for resh (Resource Shell).
#
# Every job runs inside a standard Rust container (which runs as root inside
# the container; no privileged mode, host mounts or Docker socket are needed)
# and only builds and tests the crate. No job touches real services, packages, users, firewall
# rules, databases, or plugin registries: the default test suite is hermetic
# (system commands are stubbed or mocked under cfg(test)), and the tests that
# need real infrastructure are #[ignore]d and run only in the manual
# `test:infrastructure` job below, against disposable services you provide.
#
# Gates (must pass): build:msrv, test:msrv, test:stable,
# test:security-regression, fmt, audit.
# Advisory (reported, never fails the pipeline): clippy. See
# docs/reviews/resh-cli-lint-baseline.md.

stages:
  - build
  - test
  - lint

variables:
  # Keep Cargo's registry inside the project so it can be cached.
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CARGO_TERM_COLOR: "never"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Minimum supported Rust version (Cargo.toml rust-version) and the newer
  # toolchain the release was verified with.
  MSRV_IMAGE: "rust:1.88.0-bookworm"
  STABLE_IMAGE: "rust:1.98.1-bookworm"

default:
  interruptible: true

.cargo-cache:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: "$CI_JOB_NAME_SLUG"
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - target/

# Integration-test variables must never leak into the default suite: with
# them set, #[ignore]d tests are still skipped, but some tests change what
# they connect to.
.hermetic-env:
  before_script:
    - unset MAIL_SMTP_USERNAME MAIL_SMTP_PASSWORD TEST_POSTGRES_DSN TEST_MYSQL_DSN
      TEST_REDIS_URL TEST_MEMCACHED_ADDR TEST_GIT_CLONE_HTTPS_URL
      TEST_GIT_PULL_HTTPS_URL TEST_GIT_PUSH_HTTPS_URL
    - rustc --version && cargo --version

build:msrv:
  stage: build
  image: $MSRV_IMAGE
  extends: [.cargo-cache, .hermetic-env]
  script:
    # Fails if Cargo.lock is missing or would have to change.
    - cargo metadata --locked --format-version 1 > /dev/null
    - cargo build --locked --all-targets
    - cargo build --locked --release

test:msrv:
  stage: test
  image: $MSRV_IMAGE
  extends: [.cargo-cache, .hermetic-env]
  script:
    # Includes the help-system and documentation-example tests.
    - cargo test --locked --no-fail-fast

test:stable:
  stage: test
  image: $STABLE_IMAGE
  extends: [.cargo-cache, .hermetic-env]
  script:
    - cargo test --locked --no-fail-fast

# The Stage 1-4 security and correctness regression tests, run by name so a
# failure is visible on its own. They are also part of test:msrv.
test:security-regression:
  stage: test
  image: $MSRV_IMAGE
  extends: [.cargo-cache, .hermetic-env]
  script:
    - >
      cargo test --locked --lib --
      archiveh::extract_safety_tests archiveh::zip_password_tests
      archiveh::tests::test_password_support archiveh::tests::test_path_sanitization
      plugin::store::tests plugin::engine::tests plugin::engine::artifact_security_tests
      pluginh::dry_run_tests
      proch::tests::pid proch::tests::proc_url proch::tests::resolve_pid proch::tests::kill_stage
      pkgh::cmdline_safety_tests pkgh::result_status_tests
      lenient::tests parse:: core::tests core::status::tests
      cronh::dry_run_tests cronh::tests userh::dry_run_tests userh::tests::test_unlock
      firewallh::dry_run_tests firewallh::backup_tests firewallh::timeout_tests
      sshh::tests::exec gith::sync_correctness_tests gith::timeout_rejection_tests
      svch::tests backuph::timeout_tests backuph::profile_tests
      fileh::relative_dir_tests snapshot::diff_by_name_tests
      httph::allow_insecure_tests dbh::tests::failed_ping
      backuph::dry_run_tests mailh::send_dry_run_tests fsh::stage4_tests
      archiveh::zstd_rewrite_tests
    - cargo test --locked --test stage4_regressions

# Run manually, with the TEST_* variables pointing at DISPOSABLE services
# (a throwaway bare git repository, PostgreSQL and MySQL/MariaDB databases
# that may be modified). Never point these at production systems.
test:infrastructure:
  stage: test
  image: $MSRV_IMAGE
  extends: [.cargo-cache]
  when: manual
  allow_failure: true
  script:
    - cargo test --locked --lib -- --ignored

fmt:
  stage: lint
  image: $STABLE_IMAGE
  needs: []
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check

clippy:
  stage: lint
  image: $STABLE_IMAGE
  extends: [.cargo-cache]
  needs: []
  # Pre-existing lint debt (docs/reviews/resh-cli-lint-baseline.md) makes this
  # job fail today. It is reported, not hidden, and does not block merges.
  allow_failure: true
  script:
    - rustup component add clippy
    - cargo clippy --locked --workspace --all-targets > clippy.txt 2>&1 || { tail -n 200 clippy.txt; exit 1; }
    - tail -n 50 clippy.txt
  artifacts:
    when: always
    paths:
      - clippy.txt
    expire_in: 30 days

# Fails on any RustSec vulnerability advisory that is not listed, with its
# assessment, in .cargo/audit.toml.
audit:
  stage: lint
  image: $STABLE_IMAGE
  needs: []
  cache:
    key: cargo-audit-0.22.2
    paths:
      - .cargo-home/bin/
  script:
    - test -x .cargo-home/bin/cargo-audit || cargo install cargo-audit --locked --version 0.22.2
    - cargo audit
