# cargo-audit configuration for resh.
#
# Every ignored advisory below was assessed for reachability in resh during
# the Stage 4 release review; the reasoning is recorded in
# docs/reviews/resh-cli-stage4-final-release-assessment.md (Dependency
# Security). Any advisory NOT listed here fails `cargo audit`. Remove an entry
# as soon as the dependency is upgraded, and re-assess entries whenever the
# dependency graph or the code calling these crates changes.

[advisories]
ignore = [
    # crossbeam-epoch 0.9.18 (via rayon/ignore): fmt::Pointer impl
    # dereferences invalid pointers. resh never formats crossbeam pointers.
    "RUSTSEC-2026-0204",
    # h2 0.3.27: only reached through hyper 0.14 in the dev-dependency mock
    # HTTP servers httptest and httpmock (mockito uses hyper 1 and h2 0.4);
    # not in the release binary. The h2 0.4 used by reqwest is patched.
    "RUSTSEC-2026-0258",
    # idna 0.4.0 (via trust-dns-proto 0.23): ASCII-only Punycode labels are
    # accepted. resh resolves names the operator supplies and makes no trust
    # decision on IDN equivalence. Fix needs trust-dns -> hickory-dns.
    "RUSTSEC-2024-0421",
    # lettre 0.11.19: hostname verification bug in the boring-tls backend
    # only. resh builds lettre with native-tls; boring-tls is not compiled.
    "RUSTSEC-2026-0141",
    # quick-xml 0.18.1: declared build-dependency of email-address-parser
    # 2.0.0, whose published package has no build.rs, so Cargo never compiles
    # or runs it. No fixed email-address-parser release drops it (2.0.2 still
    # requires quick-xml ^0.39).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # quinn-proto 0.11.13: present in Cargo.lock only; reqwest's HTTP/3
    # support is not enabled, so it is not compiled.
    "RUSTSEC-2026-0037",
    "RUSTSEC-2026-0185",
    "RUSTSEC-2026-0338",
    "RUSTSEC-2026-0339",
    "RUSTSEC-2026-0340",
    "RUSTSEC-2026-0342",
    # ring 0.16.20 (via x509-parser 0.15 / rcgen 0.12): AES functions may
    # panic with overflow checks enabled. resh does not use ring 0.16 AES,
    # and release builds have overflow checks off.
    "RUSTSEC-2025-0009",
    # rsa 0.9.9: Marvin timing side channel in RSA decryption. No fixed
    # release exists. resh generates keys and signs; it exposes no RSA
    # decryption oracle (sqlx-mysql only encrypts with the server key).
    "RUSTSEC-2023-0071",
    # time 0.3.44: stack exhaustion when PARSING RFC 2822. resh and its
    # dependencies only FORMAT RFC 2822 (x509-parser to_rfc2822).
    "RUSTSEC-2026-0009",
    # zip 0.6.6: ZipArchive::extract / ZipStreamReader::extract apply modes,
    # symlinks and SUID bits. resh never calls them; its own extractor writes
    # regular files with create_new and no entry modes. Fix is zip >= 9.0, a
    # major API migration.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # zip 0.6.6 RUSTSEC-2026-0429 (High): ZipArchive::extract aborts the
    # process on a symlink entry whose declared uncompressed size is large.
    # NOT REACHABLE in resh (proven in
    # resh-security-private/v1.0.5-beta/dependency-disposition-and-release-freeze/
    # RUSTSEC-2026-0429-REACHABILITY.md): resh never calls ZipArchive::extract
    # or ZipStreamReader; extract_zip_archive iterates by_index and writes each
    # entry itself; it does NOT trust the entry's declared size (copy_limited
    # with a byte budget) and never creates symlinks (writes regular files,
    # is_symlink:false). The vulnerable abort path (the convenience extractor
    # reacting to a symlink entry's declared size) is therefore never invoked.
    # Residual risk: none while resh does not call the zip extract helpers.
    # Scope: this dependency graph (zip 0.6.6) only. Owner accepts the residual
    # in OWNER-RISK-DECISIONS.md (reviewer records the technical rationale, not
    # the acceptance). Review date: 2026-11-03. Revalidate if resh adds any
    # call to zip's extract/ZipStreamReader APIs or bumps zip. Follow-up:
    # upgrade to zip >= 9.0 in v1.0.7-beta (retires 0367/0368/0369/0429).
    "RUSTSEC-2026-0429",
    # The five entries below were assessed in
    # docs/reviews/resh-cli-v1.0.3-beta-release-execution.md (advisory-db
    # 2026-10-26).
    # zstd 0.13.3: context reuse leaks an abandoned stream. Only
    # raw::{Encoder,Decoder}::with_context are affected; resh uses
    # stream::read::Decoder and stream::write::Encoder only. Fix: zstd >= 0.14.3.
    "RUSTSEC-2026-0391",
    # zstd-safe 5.0.2 (zip 0.6.6) and 7.2.4: uninitialized memory on a failed
    # legacy-frame decompress through stream::write::Decoder. resh and zip
    # decompress only through stream::read::Decoder, which is not affected.
    "RUSTSEC-2026-0403",
    # zstd-safe 7.2.4: Seekable::decompress; the `seekable` feature is off.
    "RUSTSEC-2026-0398",
    # zstd-sys 2.0.16: WebAssembly allocator shim only; resh is x86_64 Linux.
    "RUSTSEC-2026-0410",
    # crypto-bigint 0.5.5 (p256/p384 via elliptic-curve 0.13): timing
    # variability in constant-time arithmetic. ACCEPTED RISK, not unreachable:
    # secret P-256/P-384 scalars pass through it in cert key generation, key
    # import and re-encoding, and `cert sign` raw data signatures.
    # Certificates and CSRs are signed by rcgen with ring instead. Only a
    # local timing observer could exploit it; there is no network signing
    # oracle. The advisory's 0.7.6 and 0.7.7-0.7.8 are yanked; the usable fix
    # is crypto-bigint >= 0.7.9, reached through elliptic-curve >= 0.14.3
    # with p256/p384 0.14, a major RustCrypto upgrade.
    "RUSTSEC-2026-0387",
]
