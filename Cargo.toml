[package]
name = "resh"
version = "1.0.6-beta"
edition = "2024"
# Lowest toolchain verified to build the locked dependency set.
rust-version = "1.88"
authors = ["Scott Miller <smiller@millertechnologygroupllc.com>"]
license = "Apache-2.0"
description = "AI-Native Automation Platform for Modern Infrastructure"
repository = "https://github.com/millertechnologygroup/resh"
readme = "README.md"
keywords = ["automation", "devops", "infrastructure", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
time = "0.3"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.9"
percent-encoding = "2"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
handlebars = "5"
tera = "1"
url = "2"
urlencoding = "2"
regex = "1"
dirs = "5"
libc = "0.2"
md5 = "0.7"
sha1 = "0.10"
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
ring = "0.17"
blake3 = "1"
walkdir = "2"
globset = "0.4"
notify = "6"
nix = { version = "0.29", default-features = false, features = ["user", "fs", "process", "resource"] }

zbus = { version = "3", default-features = true, features = ["tokio"] }
zvariant = "3"
which = "6"
base64 = "0.22"
xattr = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
rand = "0.8"
rsa = "0.9"
filetime = "0.2"
if-addrs = "0.11"
trust-dns-resolver = "0.23"
trust-dns-client = "0.23"
trust-dns-proto = "0.23"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
# default-features off so reqwest does not also pull in native-tls/OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "charset", "http2"] }
# net tcp_check expect_tls (already in Cargo.lock through reqwest; ring provider)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# cert verify / chain.info path validation (already in Cargo.lock through rustls; ring provider)
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "chrono"] }
# tokio-rustls-comp: rediss:// over the rustls 0.23 (ring) already in the tree
redis = { version = "1.8", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "script"] }
# db: read result rows as a stream (already in Cargo.lock through sqlx)
futures-util = { version = "0.3", default-features = false }
dashmap = "6"
log = "0.4"
git2 = { version = "0.21", features = ["ssh", "https"] }
x509-parser = "0.16"
bcrypt = "0.15"
der = "0.7"
pem = "3.0"
pkcs8 = { version = "0.10", features = ["pkcs5"] }
pkcs1 = "0.7"
sec1 = "0.7"
p256 = "0.13"
p384 = "0.13"
ed25519-dalek = "2.0"
hex = "0.4"
rcgen = { version = "0.12", features = ["x509-parser", "ring"] }
x509-cert = "0.2"
cms = "0.2"
spki = "0.7"
const-oid = "0.9"
argon2 = "0.5"
pbkdf2 = { version = "0.12", features = ["simple"] }
openssh = "0.11"
sysinfo = "0.32"

# Backup and encryption
aes-gcm = "0.10"
glob = "0.3"

# Archive handling
tar = "0.4"
zip = "0.6"

# Compression  
flate2 = "1.0"
xz2 = "0.1"
zstd = "0.13"

# Mail handling
# rustls instead of the default native-tls (OpenSSL)
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "rustls-tls"] }
email-address-parser = "2.0"
# OS keyring for stored SMTP passwords: Secret Service on Linux (secret-service
# 3 over the zbus 3 already in the tree, tokio runtime, pure-Rust crypto) and
# Keychain on macOS.
keyring = { version = "=2.3.3", default-features = false, features = ["linux-secret-service-rt-tokio-crypto-rust", "platform-macos"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
httptest = "0.15"
mockito = "1"
httpmock = "0.7"
scopeguard = "1"

which = "6"

[features]
dns-e2e = []
# End-to-end tests that run inside throwaway Docker containers (never on the host).
e2e-docker = []
pkg-dnf-integration = []
pkg-yum-integration = []
pkg-pacman-integration = []
pkg-apk-integration = []
pkg-brew-integration = []
